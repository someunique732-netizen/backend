{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Inventory System</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{% static 'api/css/style.css' %}"
    >

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Inventory System</h1>

            <p>
                Import items and export today's customers.
            </p>

            <!-- IMPORT FORM -->
<form
    method="POST"
    enctype="multipart/form-data"
    action="/import-items/"
    id="importForm"
>

    {% csrf_token %}

    <!-- Hidden File Input -->
    <input
        type="file"
        name="excel_file"
        id="fileInput"
        accept=".xlsx,.xls,.csv"
        hidden
    >

    <!-- Import Button -->
    <button
        type="button"
        class="import-btn"
        onclick="document.getElementById('fileInput').click()"
    >
        Import Item
    </button>

</form>

            <!-- EXPORT BUTTON -->
            <a href="/export-customers/">

                <button class="export-btn">
                    Export Orders
                </button>

            </a>

        </div>

    </div>

   
 <script>

document
    .getElementById('fileInput')
    .addEventListener('change', function() {

        if (this.files.length > 0) {

            // Auto Submit Form
            document
                .getElementById('importForm')
                .submit();
        }

    });

</script>   

</body>

</html>
